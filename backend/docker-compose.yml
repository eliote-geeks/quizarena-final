# Postgres + Redis pour le développement local uniquement.
# En production (79.137.32.27), on utilise les mêmes images via systemd
# ou un docker-compose serveur séparé — voir README § Déploiement.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizarena
      POSTGRES_PASSWORD: quizarena
      POSTGRES_DB: quizarena
    ports:
      - "5432:5432"
    volumes:
      - qa_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  qa_pg_data:
